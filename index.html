      act({ wl:'word', slot, w, ti:g.ti, r:g.round }); buzz([40, 30, 40]);
      inp.blur(); update(g);
      setTimeout(() => { if (pend && pend.key === key && g && !g.sub[pend.slot]) { pend = null; delete sent[key]; $e('.wlErr').textContent = 'Nicht angekommen. Bitte nochmal senden.'; update(g); } }, 5000);
    }
    $e('.wlSend').addEventListener('click', submit);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
    inp.addEventListener('input', () => { $e('.wlErr').textContent = ''; });
    el.addEventListener('click', e => { const b = e.target.closest('[data-claim]'); if (b && !b.disabled && g) { act({ wl:'claim', slot:+b.dataset.claim, ti:g.ti, r:g.round }); buzz(30); } });
    function update(ng) {
      g = ng;
      const t = myTeam(), chars = S.teams[t] || [], tc = TEAMC[t], np = S.tlive[t] || 0;
      if (pend && g.sub[pend.slot]) pend = null;
      let s = -1, who = '';
      if (np >= 2) {
        const my = g.claims.indexOf(me);
        if (my < 0) who = `<p class="wlQ">Wer tippt an diesem Handy?</p><div class="wlClaim">${[0, 1].map(k => { const taken = g.claims[k] && g.claims[k] !== me; return `<button type="button" class="wlCb" data-claim="${k}" ${taken || g.sub[k] ? 'disabled' : ''}>${bust(chars[k], tc)}<b>${esc(chars[k])}</b><small>${g.sub[k] ? 'hat schon getippt' : taken ? 'am anderen Handy' : 'Das bin ich'}</small></button>`; }).join('')}</div>`;
        else if (!g.sub[my]) s = my;
        else who = `<p class="wlQ">✓ Abgeschickt${sent[`${g.ti}|${g.round}|${my}`] ? `: „${esc(sent[`${g.ti}|${g.round}|${my}`])}“` : ''}</p>`;
      } else s = !g.sub[0] ? 0 : !g.sub[1] ? 1 : -1;
      if (s >= 0 && g.tvIn === s) { who = `<p class="wlQ">${esc(chars[s])} tippt gerade am Fernseher.</p>`; s = -1; }
      if (g.sub[0] && g.sub[1]) who = `<p class="wlQ">Beide haben getippt! Schaut auf den Fernseher.</p>`;
      const nk = `${g.ti}|${g.round}|${s}`;
      if (nk !== key) { key = nk; inp.value = ''; $e('.wlErr').textContent = ''; }
      slot = s;
      const form = $e('.wlForm');
      form.hidden = s < 0;
      if (s >= 0) {
        $e('.wlLab').innerHTML = np >= 2 ? `${esc(chars[s])}, dein Wort:` : s === 0 ? `<b>${esc(chars[0])}</b> tippt zuerst. ${esc(chars[1])}, schau weg! 🙈` : `Jetzt <b>${esc(chars[1])}</b>! ${esc(chars[0])}, schau weg! 🙈`;
        inp.disabled = !!pend; $e('.wlSend').disabled = !!pend; $e('.wlSend').textContent = pend ? '…' : 'OK';
      }
      $e('.wlWho').innerHTML = who;
      $e('.wlStat').innerHTML = [0, 1].map(k => `<div class="wlS${g.sub[k] ? ' ok' : ''}">${bust(chars[k], tc)}<b>${esc(chars[k])}</b><span>${g.sub[k] ? '✓ hat getippt' : g.tvIn === k ? 'tippt am Fernseher' : 'tippt noch …'}</span></div>`).join('');
    }
    return { el, update };
  }
  function mountWL(refocus) {
    const host = document.getElementById('wlHost'); if (!host || !S || !S.g || S.g.id !== 'wl') return;
    if (!local.wl) local.wl = wlUI();
    if (local.wl.el.parentNode !== host) host.appendChild(local.wl.el);
    local.wl.update(S.g);
    const inp = local.wl.el.querySelector('#wlInp');
    if (refocus && !inp.disabled && document.activeElement !== inp) inp.focus();
  }
  // ---------- Einlass! am Handy ----------
  function einHTML(g) {
    const t = myTeam(), P = g.T[t], tc = TEAMC[t];
    const wait = (h2, p) => `<section class="card pcard wait"><img class="bust" src="${ART.bust.Hugo}" alt="Hugo"><h2 class="ph2">${h2}</h2><p class="psub">${p}</p></section>`;
    if (!P) return wait('Ihr spielt diesmal nicht mit', 'Schaut auf den Fernseher.');
    const head = `<p class="psub" style="text-align:center;color:#ffe8c4">Einlass! · Abend ${g.night} von ${g.nights} · Kasse <b>${P.money} €</b></p>`;
    const face = id => { const c = EI_CARDS[id]; return `<span class="eiFace" style="--sz:34px">${eiArt(c.who, null, c.mies ? 'happy' : c.a ? 'ok' : 'happy')}</span>`; };
    const own = Object.fromEntries((P.own || []).map(i => [i, true]));
    switch (g.phase) {
      case 'plan':
        return head + `<div class="timer"><i id="tm" style="width:100%"></i></div>${g.pity.includes(t) ? `<p class="eiPity">Hugo hat Mitleid: +${EI_PITY} € für euch! 🎁</p>` : ''}<div id="eiHost"></div>`;
      case 'reveal': {
        const m = P.motto ? EI_MOTTO_BY[P.motto] : null;
        const evs = (g.evs || []).filter(e => e.from === t || e.to === t);
        return head + `<section class="card pcard eiRv">${m ? `<div class="eiMy" style="--mc:${m.c}"><span>${m.e}</span><b>${m.n}</b></div>` : ''}<p class="psub" style="color:var(--ink)">Hugo verteilt am Fernseher die Mottos und Gemeinheiten …</p>
          ${evs.map(e => { const it = EI_SHOP_BY[e.id]; return e.to === t ? `<div class="eiHit${e.blocked ? ' ok' : ''}">${e.blocked ? '🛡️' : '😈'} <span>${e.blocked ? `Abgewehrt: ${esc(it.n)} von Team ${TEAMC[e.from].name}` : `${esc(it.n)} von Team ${TEAMC[e.from].name} landet bei euch!`}</span></div>` : `<div class="eiHit mine">🎯 <span>Euer ${esc(it.n)} trifft Team ${TEAMC[e.to].name}${e.blocked ? ', wird aber abgewehrt' : ''}.</span></div>`; }).join('')}</section>`;
      }
      case 'night': {
        const st = P.state, comp = P.comp || {}, ids = Object.keys(comp).sort((a, b) => eiTrouble(b, own) - eiTrouble(a, own) || EI_CARDS[b].m - EI_CARDS[a].m);
        const tr = Array.from({ length: P.limit }, (_, i) => `<i class="${i < P.aerger ? 'on' : ''}">⚡</i>`).join('');
        let danger = 0; ids.forEach(id => { if (P.aerger + Math.max(0, eiTrouble(id, own) - P.shield) >= P.limit) danger += comp[id]; });
        const m = EI_MOTTO_BY[P.motto];
        let h = head + `<section class="card pcard eiStat" style="--c:${tc.c}"><div class="eiStatTop"><span>Welle ${g.wave}</span>${m ? `<span class="eiMt" style="--mc:${m.c}">${m.e} ${P.uniq && !P.strom ? `+${P.bonus * (own.kugel ? 2 : 1)} €` : 'kein Bonus'}</span>` : ''}</div>
          <div class="eiStatRow"><div><small>Heute</small><b>${P.tonight} €</b></div><div><small>Ärger</small><span class="eiTr">${tr}</span>${P.shield ? '<small>🕶️ Türsteher bereit</small>' : ''}</div><div><small>Drin</small><b>${P.inside}/${P.cap}</b></div></div>
          ${P.dbl ? '<p class="eiNote">📱 Influencerin: Der nächste zahlende Gast bringt doppelt!</p>' : ''}</section>`;
        if (P.last) h += `<section class="card pcard eiLastP"><small>Zuletzt reingekommen</small>${eiCardHTML(P.last.id, { short:true, money:P.last.money })}<div class="eiPops">${P.last.money ? `<span class="m">+${P.last.money} €</span>` : '<span class="z">0 €</span>'}${P.last.a ? `<span class="a">${'⚡'.repeat(P.last.a)}</span>` : ''}${P.last.absorbed ? '<span class="s">🕶️ abgewehrt</span>' : ''}${P.last.calmed ? '<span class="c">😌 −1 Ärger</span>' : ''}</div></section>`;
        if (st === 'open') {
          h += `<section class="card pcard eiQP"><h2 class="ph2">Noch in der Schlange: ${P.qlen}</h2><p class="psub" style="color:var(--ink)">Wer als Nächstes kommt, weiß niemand.</p>
            <div class="eiQList">${ids.map(id => { const c = EI_CARDS[id], a = eiTrouble(id, own); return `<div class="eiQi${a ? ' bad' : ''}${c.mies ? ' mies' : ''}">${face(id)}<span><b>${esc(c.n)}</b><small>${c.mies ? 'Gemeinheit · 0 €' : `+${eiMoney(id, own, { uniq:P.uniq, strom:P.strom, bonus:P.bonus })} €`}${a ? ' · ' + '⚡'.repeat(a) : ''}${c.fx === 'calm' ? ' · beruhigt' : c.fx === 'double' ? ' · verdoppelt' : ''}</small></span><em>×${comp[id]}</em></div>`; }).join('')}</div>
            <p class="eiRisk${danger ? ' bad' : ''}">${danger ? `🚨 ${danger} von ${P.qlen} Gästen würden jetzt die Polizei auslösen` : '😎 Gerade kann keiner die Polizei auslösen'}</p>
            <div class="timer"><i id="tm" style="width:100%"></i></div>
            ${P.dec ? `<p class="eiDone">✓ ${P.dec === 'in' ? 'Reinlassen' : 'Laden dicht'}: Warte auf die anderen Hütten …</p>` : `<div class="eiBtns"><button class="btn eiIn" data-eid="in">Reinlassen</button><button class="btn sec eiOut" data-eid="out">Laden dicht</button></div>`}</section>`;
        } else {
          h += `<section class="card pcard wait eiEnd s-${st}"><h2 class="ph2">${st === 'busted' ? '🚨 Polizei!' : st === 'closed' ? 'Laden dicht 💰' : st === 'full' ? 'Hütte voll! 🎉' : 'Alle Gäste drin!'}</h2><p class="psub" style="color:var(--ink)">${st === 'busted' ? `Die Hälfte der Einnahmen ist weg.${g.drink ? ' Und: 2 Schlucke für euch!' : ''}` : `${P.tonight} € sind sicher.`} Schaut, wie es bei den anderen läuft.</p></section>`;
        }
        return h;
      }
      case 'settle': {
        const p = P.pay, rk = g.teams.slice().sort((a, b) => g.T[b].money - g.T[a].money);
        return head + `<section class="card pcard wait"><h2 class="ph2">${p ? `Abend ${g.night}: +${p.pay} €` : 'Abrechnung'}</h2><p class="psub" style="color:var(--ink)">${p && p.lost ? 'Die Polizei hat die Hälfte kassiert.' : p && p.garde ? 'Inklusive 15 € von der Garderobe.' : 'Gut gewirtschaftet!'}</p></section>
          <section class="card pcard"><h2 class="ph2">Kassenstand</h2>${rk.map((x, i) => `<div class="ckRow wlRk${x === t ? ' me2' : ''}" style="--c:${TEAMC[x].c};--t:${TEAMC[x].t}"><span class="n">${i + 1}</span><span>Team ${TEAMC[x].name}</span><b>${g.T[x].money} €</b></div>`).join('')}</section>`;
      }
      case 'finale': {
        const rk = g.rank || [];
        return head + `<section class="card pcard"><h2 class="ph2">Wer hat die vollste Kasse?</h2>${rk.map((r, i) => `<div class="ckRow wlRk${r.t === t ? ' me2' : ''}" style="--c:${TEAMC[r.t].c};--t:${TEAMC[r.t].t}"><span class="n">${i + 1}</span><span>Team ${TEAMC[r.t].name}</span><b>${r.money} €</b></div>`).join('')}</section>`;
      }
    }
    return head;
  }
  function mountEI() {
    const host = document.getElementById('eiHost');
    if (!host || !S || !S.g || S.g.id !== 'ein' || S.g.phase !== 'plan') return;
    const t = myTeam(), P = S.g.T[t]; if (!P) return;
    if (!local.eiUI) local.eiUI = EiPlanUI({ big:false, tap: () => buzz(15), onChange: plan => act({ ei:'plan', n:S.g.night, plan }) });
    if (local.eiUI.el.parentNode !== host) host.appendChild(local.eiUI.el);
    const key = S.g.gid + '|' + S.g.night + '|' + t;
    if (local.eiKey !== key || !local.eiInfo || local.eiInfo.money !== P.money || local.eiInfo.ownN !== P.own.length || local.eiInfo.deckN !== P.deck.length) {
      local.eiKey = key; local.eiInfo = { money:P.money, ownN:P.own.length, deckN:P.deck.length };
      local.eiUI.update({ key, money:P.money, own:Object.fromEntries(P.own.map(i => [i, true])), deck:P.deck, bonus:S.g.bonus, plan:P.plan });
    }
  }
  function ludoHTML(g) {
    const t = myTeam(), tc = TEAMC[t], meP = g.players.find(p => p.seat === t);
    const posText = p => p === -1 ? 'Im Haus' : p >= 64 ? `Im Ziel (Zielfeld ${p - 63})` : `Unterwegs, noch ${64 - p} Felder bis ins Ziel`;
    const charOf = j => S.teams[t][j % S.teams[t].length];
    const FACES = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
    const dieH = (n, en, rolling) => `<button class="pdie${en ? ' ready' : ''}${rolling ? ' rolling' : ''}" id="pdie" ${en ? '' : 'disabled'} aria-label="Würfeln">${Array.from({ length: 9 }, (_, i) => `<i class="pip${FACES[n || 6].includes(i) ? ' on' : ''}"></i>`).join('')}</button>`;
    if (!meP) return `<section class="card pcard wait"><h2 class="ph2">Gleich geht's los</h2><p class="psub">Schaut auf den Fernseher.</p></section>`;
    const home = meP.pieces.filter(x => x >= 64).length;
    let h = `<p class="psub" style="text-align:center;color:#ffe8c4">Mensch ärgere dich · Im Ziel: <b>${home} von ${g.np}</b></p>`;
    if (g.phase === 'done') {
      const w = g.winner;
      return h + `<section class="card pcard wait" style="background:${w === t ? 'var(--gold)' : ''}"><h2 class="ph2">${w === t ? 'Ihr habt gewonnen!' : `Team ${TEAMC[w].name} gewinnt!`}</h2></section>`;
    }
    const mine = g.cur === t, cur = g.players.find(p => p.seat === g.cur), cc = TEAMC[g.cur];
    if (mine) {
      h += `<section class="card pcard" style="--d:${tc.d}"><h2 class="ph2" style="text-align:center">Ihr seid dran!</h2>`;
      if (g.lp === 'move' && !local.sent) {
        h += `<p class="psub" style="text-align:center;color:var(--ink);font-weight:700">Eine ${g.die}! Welche Figur soll ziehen?</p>`;
        h += g.moves.map(mv => `<button class="mvb" data-mv="${mv.j}">${bust(charOf(mv.j), tc)}<span><b>${esc(charOf(mv.j))} · Figur ${mv.j + 1}</b>${esc(posText(meP.pieces[mv.j]))}<span class="out">${esc(mv.info)}</span></span></button>`).join('');
      } else {
        const can = g.lp === 'roll' && !local.sent;
        h += dieH(g.die, can, g.lp === 'rolling' || (local.sent && g.lp === 'roll'));
        h += `<p class="note">${can ? (g.tries === 3 ? 'Tippen zum Würfeln. Ihr braucht eine 6 (3 Versuche).' : g.tries < 3 && !meP.pieces.some(x => x >= 0 && x < 64) ? `Nochmal! Noch ${g.tries} Versuch${g.tries > 1 ? 'e' : ''} für die 6.` : 'Tippen zum Würfeln!') : g.lp === 'anim' ? esc(g.hint || 'Die Figur läuft …') : 'Würfelt …'}</p>`;
      }
      h += `</section>`;
    } else {
      h += `<section class="card pcard wait"><div style="display:flex;justify-content:center">${S.teams[g.cur].map(ch => bust(ch, cc)).join('')}</div><h2 class="ph2">Team ${cc.name} ist dran</h2><p class="psub">${cur && cur.cpu ? 'Der Computer spielt für sie.' : esc(g.hint || '')}</p>${g.last ? `<p class="note">${esc(g.last)}</p>` : ''}</section>`;
    }
    h += `<section class="card pcard"><div class="eyebrow">Eure Figuren</div>${meP.pieces.map((p, j) => `<div class="prow">${bust(charOf(j), tc)}<div><b>${esc(charOf(j))} · Figur ${j + 1}</b><span>${esc(posText(p))}</span></div></div>`).join('')}</section>`;
    return h;
  }
  function cookieHTML(g) {
    const t = myTeam(), L = ['A', 'B', 'C', 'D'];
    const order = S.teams.map((_, i) => i).filter(i => S.teams[i].length).sort((a, b) => g.score[b] - g.score[a] || a - b);
    let h = `<p class="psub" style="text-align:center;color:#ffe8c4">Plätzchen-Tabletts · Runde ${g.round} von ${g.rounds} · Euer Stand: <b>${g.score[t]}</b> · Platz ${order.indexOf(t) + 1}</p>`;
    const mp = g.picks[t];
    if (g.phase === 'serve') return h + `<section class="card pcard wait"><img class="bust" src="${ART.bust.Hugo}" alt="Hugo"><h2 class="ph2">Hugo serviert …</h2><p class="psub">Schaut auf den Fernseher: Gleich kommen vier Tabletts.</p></section>`;
    if (g.phase === 'vote') {
      if (g.locked[t]) return h + `<section class="card pcard wait"><h2 class="ph2">Festgelegt: Tablett ${L[mp]}</h2><p class="psub" style="color:var(--ink);font-size:20px">${g.trays[mp]} Plätzchen, wenn kein anderes Team es auch nimmt.</p><div class="timer"><i id="tm" style="width:100%"></i></div><p class="psub">Warte auf die anderen Teams.</p></section>`;
      const mate = g.by[t] && g.by[t] !== me;
      h += `<section class="card pcard"><h2 class="ph2">Welches Tablett nehmt ihr?</h2><p class="psub">Allein auf einem Tablett gibt's alles, geteilt gibt's nichts.</p><div class="timer"><i id="tm" style="width:100%"></i></div>`;
      h += g.trays.map((n, i) => `<button class="trayb${mp === i ? ' sel' : ''}" data-tray="${i}"><span class="lt">${L[i]}</span><span><b>Tablett ${L[i]}</b><span class="mcs">${'<i class="mc"></i>'.repeat(n)}</span></span><span class="num">${n}</span></button>`).join('');
      if (mate && mp != null) h += `<p class="note">Ein anderes Handy aus eurem Team hat Tablett ${L[mp]} gewählt.</p>`;
      h += `<div class="row2"><button class="btn" id="lock" ${mp == null ? 'disabled' : ''}>${mp == null ? 'Erst ein Tablett wählen' : `Tablett ${L[mp]} festlegen`}</button></div></section>`;
      return h;
    }
    if (g.phase === 'reveal') {
      if (mp == null) return h + `<section class="card pcard wait"><h2 class="ph2">Ihr habt diesmal nichts gewählt</h2><p class="psub">Nächste Runde schneller sein!</p></section>`;
      if (g.revealed < mp) return h + `<section class="card pcard wait"><h2 class="ph2">Tablett ${L[mp]} …</h2><p class="psub">Spannung! Hugo deckt gerade auf.</p></section>`;
      const others = Object.keys(g.picks).map(Number).filter(o => o !== t && g.picks[o] === mp);
      if (g.gain && g.gain[t]) return h + `<section class="card pcard wait" style="background:#bdeccd"><h2 class="ph2">Allein auf Tablett ${L[mp]}!</h2><p class="psub" style="color:var(--ink);font-size:22px">+${g.gain[t]} Plätzchen für euch</p></section>`;
      return h + `<section class="card pcard wait" style="background:#ffd9d5"><h2 class="ph2">Geteilt! Keiner bekommt etwas</h2><p class="psub" style="color:var(--ink);font-size:18px">Tablett ${L[mp]} wollte auch ${others.map(o => 'Team ' + TEAMC[o].name).join(' und ')}.</p></section>`;
    }
    return h;
  }
  function bind() {
    root.querySelectorAll('.tpb').forEach(b => b.addEventListener('click', () => { setTeam(+b.dataset.team); send({ t:'join', team:+b.dataset.team, epoch: S.epoch }); keepAwake(); buzz(30); render(); }));
    const chg = $('#chg'); if (chg) chg.addEventListener('click', () => { send({ t:'leave' }); setTeam(null); render(); });
    root.querySelectorAll('.trayb').forEach(b => b.addEventListener('click', () => { act({ pick: +b.dataset.tray }); buzz(25); }));
    const pd = $('#pdie'); if (pd) pd.addEventListener('click', () => { if (pd.disabled || local.sent) return; local.sent = true; act({ roll:true }); buzz(40); render(); setTimeout(() => { local.sent = false; lastHTML = ''; render(); }, 4000); });
    root.querySelectorAll('.mvb').forEach(b => b.addEventListener('click', () => { if (local.sent) return; local.sent = true; act({ move: +b.dataset.mv }); buzz(30); render(); }));
    const lock = $('#lock'); if (lock) lock.addEventListener('click', () => { if (lock.disabled) return; act({ lock:true }); buzz(60); });
    root.querySelectorAll('[data-eid]').forEach(b => b.addEventListener('click', () => { if (b.disabled || !S.g) return; root.querySelectorAll('[data-eid]').forEach(x => { x.disabled = true; }); act({ ei: b.dataset.eid, w: S.g.wave, n: S.g.night }); buzz(35); }));
  }
  // Timer ohne Neuaufbau aktualisieren
  function tick() {
    if (S && S.g && S.g.id === 'cocktail' && (S.g.phase === 'mix' || S.g.phase === 'mixend')) {
      const g = S.g, rem = g.left == null ? null : g.left - (performance.now() - recvAt) / 1000;
      const tm = document.getElementById('tm');
      if (tm && rem != null) tm.style.width = clamp(rem / g.mixS * 100, 0, 100) + '%';
      if (local.ckUI && local.ckKey === 'ck|' + g.gi && !local.ckUI.done && g.phoneTeams.includes(myTeam()) && !g.done[myTeam()] && ((g.mixOn && rem != null && rem <= .2) || g.phase === 'mixend')) local.ckUI.autoSubmit();
    }
    if (S && S.g && S.g.phase === 'vote') {
      const tm = document.getElementById('tm');
      if (tm) tm.style.width = clamp((S.g.left - (performance.now() - recvAt) / 1000) / S.g.voteS * 100, 0, 100) + '%';
    }
    if (S && S.g && S.g.id === 'ein' && S.g.left != null && S.g.lenS) { const tm = document.getElementById('tm'); if (tm) tm.style.width = clamp((S.g.left - (performance.now() - recvAt) / 1000) / S.g.lenS * 100, 0, 100) + '%'; }
    requestAnimationFrame(tick);
  }
  render(); requestAnimationFrame(tick);
  const hello = () => send(myT !== null ? { t:'hello', team: myT, epoch: myEpoch } : { t:'hello' });
  connect(room, onMsg, st => { status = st; if (st === 'online' || st === 'local') hello(); lastHTML = ''; render(); }).then(n => { net = n; hello(); });
  setInterval(hello, 5000);
}

if (ROOM_PARAM) startPhone(ROOM_PARAM); else startTV();
})();
</script>
