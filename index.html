<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1712">
<title>Party Buddy Spieleabend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Ein Look für Fernseher und Handy: gemütliche Weihnachtshütte, Sticker-Cartoon mit dicker Tinte. */
:root{
  --ink:#2a1b2d; --cream:#fff6e6; --paper:#fffaf0; --gold:#ffd36b; --orange:#ff9b42; --red:#d92f3c; --green:#2f8a3e;
  --wood1:#4a2618; --wood2:#3a1d14; --muted:#6b5a63;
  --f:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:var(--f);color:var(--ink);background:#1a0f12;overflow:hidden}
button{font-family:inherit}

/* ---------- Gemeinsame Bausteine ---------- */
.btn{font:700 1.15em/1.1 var(--f);color:var(--ink);background:linear-gradient(180deg,#ffd36b,#ff9b42);border:3px solid var(--ink);border-radius:999px;
  box-shadow:0 5px 0 var(--ink);padding:.55em 1.4em;cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.sec{background:#fff}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.45);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 5px 0 var(--ink)}
.btn:focus-visible{outline:3px dashed #fff;outline-offset:4px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 6px 0 var(--ink)}
.eyebrow{font-size:.78em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bust{display:block;border-radius:50%;background:var(--t,#fff3d1);border:3px solid var(--c,var(--ink));object-fit:cover}

/* =================================================================
   FERNSEHER (feste Bühne 1600 × 900, wird auf den Bildschirm skaliert)
   ================================================================= */
#tv{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#3a1d1e,#120a0c 75%)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;overflow:hidden;border-radius:26px;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(255,190,110,.28),transparent 60%),
    repeating-linear-gradient(180deg,var(--wood1) 0 58px,var(--wood2) 58px 62px);
  box-shadow:0 0 0 3px rgba(255,255,255,.1),0 30px 80px rgba(0,0,0,.6);font-size:24px}
#stage::before{content:"";position:absolute;left:0;right:0;top:10px;height:40px;pointer-events:none;
  background:radial-gradient(circle,#ffe36a 0 6px,transparent 7px) 0 14px/80px 40px repeat-x,
             radial-gradient(circle,#ff6b6b 0 6px,transparent 7px) 40px 22px/80px 40px repeat-x;filter:drop-shadow(0 0 6px rgba(255,220,120,.8));opacity:.9}
#stage::after{content:"";position:absolute;left:-20px;right:-20px;top:4px;height:30px;border-bottom:4px solid #2f6a35;border-radius:0 0 50% 50%/0 0 100% 100%;pointer-events:none}
.tvtop{position:absolute;top:44px;left:40px;right:40px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.tvlogo{font-weight:700;color:#fff;font-size:26px;text-shadow:0 3px 0 var(--ink)}
.tvlogo span{color:var(--gold)}
.tvtools{display:flex;gap:12px;align-items:center}
.chip{font-weight:600;font-size:20px;color:#fff;background:rgba(30,12,12,.6);border:2px solid rgba(255,255,255,.3);border-radius:999px;padding:.3em .9em}
.chip b{color:var(--gold);letter-spacing:.08em}
.tvtools .btn{font-size:18px;padding:.4em 1em;box-shadow:none;border-width:2px}
#screen{position:absolute;inset:110px 40px 30px 40px}
#hugo{position:absolute;left:18px;bottom:-6px;width:210px;z-index:6;pointer-events:none;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
#hugo img{width:100%;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
#hugo img.serve{animation:serve .6s ease-in-out}
@keyframes serve{50%{transform:translateX(40px) rotate(4deg)}}
#hugo.away{transform:translateX(-260px)}
#hbubble{position:absolute;left:4px;bottom:352px;width:228px;background:#fff;border:3px solid var(--ink);border-radius:20px;
  padding:10px 14px;font-size:19px;font-weight:600;line-height:1.25;box-shadow:4px 5px 0 var(--ink);opacity:0;transform:translateY(10px) scale(.95);transition:opacity .2s,transform .2s}
#hbubble.show{opacity:1;transform:none}
#hbubble small{display:block;font-size:14px;letter-spacing:.12em;color:var(--red);font-weight:700}
#hbubble::after{content:"";position:absolute;left:92px;bottom:-16px;border:14px solid transparent;border-top-color:var(--ink);border-bottom:0}
#big{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:8}
#big span{font-weight:700;font-size:110px;color:var(--gold);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);text-align:center;line-height:1;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
#big span small{display:block;font-size:38px;color:#fff;-webkit-text-stroke:3px var(--ink);margin-top:12px}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
#fx{position:absolute;inset:0;width:1600px;height:900px;pointer-events:none;z-index:9}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-14px,6px)}40%{transform:translate(12px,-8px)}60%{transform:translate(-8px,4px)}80%{transform:translate(6px,-2px)}}

/* Lobby */
.lobby{display:grid;grid-template-columns:540px 1fr;gap:36px;height:100%;padding-left:210px}
.logo{margin:10px 0 0;font-size:60px;line-height:.98;color:#fff;font-weight:700;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.logo span{display:block;color:var(--gold)}
.tag{color:#ffe8c4;font-size:28px;font-weight:600;margin:14px 0 26px}
.join{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center;padding:18px}
.qr{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px;line-height:0}
.qr svg{width:100%;height:auto}
.join .code{font-size:58px;font-weight:700;letter-spacing:.1em;line-height:1;margin:6px 0 10px}
.join p{margin:0;font-size:20px;font-weight:500}
.netnote{margin-top:10px!important;font-size:16px!important;color:var(--muted)}
.netnote.bad{color:#b3261e}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.tEd{padding:14px 16px;background:var(--t);border-left:14px solid var(--c)}
.tEd h3{margin:0 0 8px;font-size:24px}
.slot{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;margin-top:8px}
.slot .bust{width:64px;height:64px}
.slot select{font:600 22px var(--f);color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 8px;width:100%}
.tlive{float:right;font-size:15px;font-weight:700;padding:2px 10px;border:2px solid var(--ink);border-radius:99px;background:#fff;color:var(--muted)}
.tlive.on{background:#3fd27a;color:var(--ink)}
.lobbyR{display:flex;flex-direction:column}
.lobbyR .eyebrow{color:#ffe8c4}
.lobbyActs{margin-top:auto;display:flex;justify-content:flex-end;gap:14px;padding-bottom:4px}
.lobbyActs .btn{font-size:30px}

/* Spielauswahl */
.menu{padding-left:230px}
.menu h2,.gh2{margin:6px 0 22px;text-align:center;color:#fff;font-size:46px;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,400px));justify-content:center;gap:24px;padding:0 10px}
.gcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:22px 18px 24px;cursor:pointer;font:inherit;color:inherit;transition:transform .15s}
.gcard:hover,.gcard:focus-visible{transform:translateY(-6px) rotate(-1deg);outline:none}
.gcard svg{width:230px;height:200px}
.gcard b{font-size:40px;line-height:1.05}
.gcard span{font-size:22px!important}
.gcard span{font-size:19px;font-weight:500;color:var(--muted)}
.gcard em{font-style:normal;font-size:16px;font-weight:700;color:var(--red);letter-spacing:.06em;text-transform:uppercase}
.wins{display:flex;justify-content:center;gap:16px;margin-top:34px}
.wteam{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;background:var(--t);border:3px solid var(--ink);border-radius:999px;box-shadow:3px 4px 0 var(--ink)}
.wteam .bust{width:46px;height:46px;margin-right:-14px;border-width:2px}
.wteam .bust:last-of-type{margin-right:0}
.wteam b{font-size:22px;margin-left:6px}
.menuActs{display:flex;justify-content:center;gap:14px;margin-top:28px}

/* Spiel-Intro */
.intro{display:grid;place-items:center;height:100%}
.introCard{width:980px;padding:34px 44px 30px;text-align:center}
.introCard h2{margin:0;font-size:60px}
.introCard ul{text-align:left;margin:20px auto 26px;padding:0;list-style:none;display:grid;gap:12px;font-size:26px;font-weight:500;max-width:820px}
.introCard li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.introCard li i{width:36px;height:36px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:20px}
.introCard .btn{font-size:32px}

/* Team-Punkte unten */
.tscore{position:absolute;left:240px;right:0;bottom:0;display:flex;justify-content:center;gap:14px}
.ts{display:flex;align-items:center;gap:8px;background:var(--t);border:3px solid var(--ink);border-radius:999px;padding:6px 16px 6px 6px;box-shadow:3px 4px 0 var(--ink);transition:transform .3s}
.ts.hot{transform:translateY(-8px) scale(1.06)}
.ts .bust{width:44px;height:44px;margin-right:-14px;border-width:2px}
.ts .bust:last-of-type{margin-right:0}
.ts b{font-size:26px;min-width:56px;text-align:right}
.tbar{height:16px;background:rgba(255,255,255,.18);border:3px solid var(--ink);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.rlabel{color:#ffe8c4;font-size:24px;font-weight:600;text-align:center}

/* Plätzchen-Tabletts */
.ck{position:relative;height:100%}
.ckHead{position:absolute;left:250px;right:310px;top:0;display:flex;align-items:center;gap:18px;color:#ffe8c4;font-size:26px;font-weight:700}
.ckHead .tbar{flex:1}
.ckHead #ckLeft{min-width:70px;text-align:right}
.trays{position:absolute;left:250px;right:310px;top:56px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.tray{position:relative;height:500px;display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(-40px)}
.tray.in{animation:trayIn .55s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes trayIn{to{opacity:1;transform:none}}
.tray .lt{width:56px;height:56px;border-radius:50%;background:var(--gold);border:4px solid var(--ink);display:grid;place-items:center;font-size:30px;font-weight:700;box-shadow:3px 4px 0 var(--ink);z-index:2}
.tray svg{width:100%;height:auto;overflow:visible;margin-top:70px;transition:filter .4s,opacity .4s}
.tray .cnt{font-size:34px;font-weight:700;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);margin-top:-8px}
.tray .cnt small{font-size:20px;-webkit-text-stroke:1px var(--ink)}
.tray .who{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:12px;min-height:150px}
.tray .tm{display:flex;align-items:center;background:var(--t);border:3px solid var(--ink);border-left:10px solid var(--c);border-radius:999px;padding:3px 10px 3px 4px;box-shadow:2px 3px 0 var(--ink);animation:pop .4s cubic-bezier(.2,1.5,.4,1) both}
.tray .tm .bust{width:40px;height:40px;margin-right:-10px;border-width:2px}
.tray .tm .bust:last-of-type{margin-right:6px}
.tray .tm b{font-size:18px}
.tray .verdict{position:absolute;left:50%;top:84px;transform:translateX(-50%) rotate(-6deg);font-size:24px;font-weight:700;padding:5px 14px;border:4px solid var(--ink);border-radius:16px;box-shadow:4px 5px 0 var(--ink);white-space:nowrap;z-index:3;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
.tray .verdict.win{background:#3fd27a}
.tray .verdict.lose{background:#ff6b6b;color:#fff;-webkit-text-stroke:1px var(--ink)}
.tray .verdict.none{background:#e9e1d6;color:var(--muted)}
.tray.lost svg{filter:grayscale(1) brightness(.7);opacity:.6}
.tray.won svg{filter:drop-shadow(0 0 22px rgba(255,230,120,.9))}
.ckStatus{position:absolute;left:250px;right:310px;bottom:6px;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;color:#ffe8c4;font-size:22px;font-weight:600}
.ckStatus .st{display:flex;align-items:center;gap:6px;background:rgba(30,12,12,.55);border:2px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 12px 4px 4px;color:#fff}
.ckStatus .st .bust{width:34px;height:34px;margin-right:-10px;border-width:2px}
.ckStatus .st .bust:last-of-type{margin-right:4px}
.ckStatus .st.ok{background:#2f8a3e}
.ckStatus .btn{font-size:20px;padding:.35em 1em}
.board{position:absolute;right:0;top:0;width:290px;padding:16px 16px 12px}
.board h3{margin:0 0 6px;font-size:24px}
.brow{display:grid;grid-template-columns:30px 70px 1fr;gap:8px;align-items:center;padding:7px 0;border-top:2px dashed #e4d6b4;transition:background .3s}
.brow:first-of-type{border-top:0}
.brow .n{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:16px}
.brow .duo2{display:flex}
.brow .bust{width:42px;height:42px;margin-right:-14px;border-width:2px}
.brow b{font-size:26px;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:6px}
.brow b i{font-style:normal;font-size:16px;font-weight:700;color:#fff;background:var(--green);border:2px solid var(--ink);border-radius:99px;padding:0 7px}
.brow .ck0{width:20px;height:20px;border-radius:50%;background:#d79b5a;border:2px solid var(--ink);flex:none}

/* Mensch ärgere dich (Globus-Ludo) */
.ludo{position:relative;height:100%}
#lboard{position:absolute;left:236px;top:-8px;width:772px;height:772px;overflow:visible;user-select:none}
.lside{position:absolute;left:1030px;right:0;top:0;bottom:0;display:flex;flex-direction:column;gap:14px}
.lturn{padding:16px 18px;display:grid;grid-template-columns:1fr 120px;gap:12px;align-items:center;background:var(--t,#fffaf0);border-left:14px solid var(--c,var(--ink))}
.lturn .duo{display:flex;align-items:center;gap:10px}
.lturn .duo .bust{width:58px;height:58px;margin-right:-18px}
.lturn .duo .bust:last-of-type{margin-right:6px}
.lturn b{font-size:32px;line-height:1}
.lturn .hint{grid-column:1 / -1;margin:0;font-size:21px;font-weight:600;min-height:2.6em}
.ldie{width:112px;height:112px;padding:17px;border:5px solid var(--ink);border-radius:24px;background:#fff;box-shadow:0 7px 0 var(--ink);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);cursor:pointer;justify-self:end}
.ldie:disabled{cursor:default;opacity:.7}
.ldie.rolling{animation:wob .56s ease-in-out}
@keyframes wob{20%{transform:rotate(-14deg) translateY(-8px)}45%{transform:rotate(12deg) translateY(-14px)}70%{transform:rotate(-6deg) translateY(-4px)}100%{transform:none}}
.pip{width:17px;height:17px;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.pip.on{visibility:visible}
.llog{padding:14px 18px;flex:1;min-height:0;overflow:hidden}
.llog ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:7px;font-size:19px;font-weight:500}
.llog li{display:grid;grid-template-columns:14px 1fr;gap:9px;align-items:baseline}
.llog li i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--c)}
.llog li:first-child{font-weight:700}
.lprog{padding:12px 18px;display:grid;gap:8px}
.lprog .r{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center}
.lprog .r .duo2{display:flex}
.lprog .r .bust{width:38px;height:38px;margin-right:-12px;border-width:2px}
.lprog .r span{font-size:18px;font-weight:600}
.lprog .stars{display:flex;gap:4px}
.lprog .stars i{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.lprog .stars i.on{background:var(--c)}
.lprog .cpu{font-size:13px;font-weight:700;color:var(--muted)}
.piece{transition-property:transform;transition-timing-function:cubic-bezier(.3,.7,.4,1)}
.piece .ring{display:none}
.piece.movable{cursor:pointer}
.piece.movable .ring{display:inline;animation:spin 3.2s linear infinite;transform-box:fill-box;transform-origin:center}
.piece.movable .pz{animation:bob .8s ease-in-out infinite}
.pz.hop{animation:hop .17s ease-out}
.pz.fly{animation:fly .5s ease-in-out}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes hop{40%{transform:translateY(-13px) scale(1.06,.94)}100%{transform:none}}
@keyframes fly{50%{transform:translateY(-30px) scale(1.3)}}
@keyframes spin{to{transform:rotate(360deg)}}
.base .bc{transition:stroke-width .2s}
.base.cur .bc{stroke-width:8;animation:bpulse 1.2s ease-in-out infinite}
@keyframes bpulse{50%{stroke-width:3}}
.blabel{font-family:var(--f);font-weight:700;font-size:13px;fill:var(--ink)}
.lparty{position:absolute;left:622px;top:262px;transform:translate(-50%,-10px) scale(.9);opacity:0;pointer-events:none;z-index:4;background:#fff;border:5px solid var(--c,var(--ink));border-radius:24px;box-shadow:5px 6px 0 var(--ink);padding:14px 26px;text-align:center;transition:opacity .2s,transform .25s cubic-bezier(.2,1.4,.4,1);max-width:560px}
.lparty.show{opacity:1;transform:translate(-50%,0) scale(1)}
.lparty small{display:block;font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lparty b{display:block;font-size:40px;line-height:1.1}
.lparty .duo{display:flex;justify-content:center;margin-bottom:6px}
.lparty .duo .bust{width:62px;height:62px;margin:0 -6px}

/* Ergebnis */
.result{display:grid;grid-template-columns:560px 1fr;gap:30px;height:100%;padding-left:240px;align-items:center}
.winner{text-align:center;position:relative}
.winner .duo{display:flex;justify-content:center;align-items:flex-end;height:430px}
.winner .duo img{height:420px;margin:0 -30px;filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
.winner .crown{position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:120px}
.winner h2{margin:6px 0 0;font-size:52px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
.winner p{margin:8px 0 0;color:#ffe8c4;font-size:26px;font-weight:600}
.rank{padding:24px 28px}
.rank h3{margin:0 0 14px;font-size:30px}
.rrow{display:grid;grid-template-columns:44px 120px 1fr 90px;gap:12px;align-items:center;margin-top:12px}
.rrow .n{width:44px;height:44px;border-radius:50%;background:var(--c);border:3px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:22px}
.rrow .duo2{display:flex}
.rrow .bust{width:56px;height:56px;margin-right:-14px;border-width:2px}
.rrow .bar{height:30px;background:var(--t);border:3px solid var(--ink);border-radius:99px;overflow:hidden}
.rrow .bar i{display:block;height:100%;background:var(--c);width:0;transition:width 1.2s cubic-bezier(.3,.8,.3,1)}
.rrow b{font-size:28px;text-align:right}
.resActs{display:flex;justify-content:flex-end;margin-top:22px}
.resActs .btn{font-size:28px}

/* =================================================================
   HANDY
   ================================================================= */
#ph{min-height:100%;overflow:auto;height:100%;-webkit-overflow-scrolling:touch;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,190,110,.25),transparent 60%),repeating-linear-gradient(180deg,var(--wood1) 0 46px,var(--wood2) 46px 50px)}
.pw{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;font-size:17px}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff}

/* Einlass! · Karten (Fernseher und Handy) */
.ecard{position:relative;display:flex;flex-direction:column;background:#fffaf0;border:3px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:3px 4px 0 var(--ink);color:var(--ink);font-family:var(--f);text-align:center;min-width:0}
.eBand{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:2px 8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--kc)}
.eBand b{font-size:13px;letter-spacing:0;background:#fff;color:var(--ink);border-radius:99px;padding:0 7px}
.k-gast{--kc:#2b9a52}.k-stoer{--kc:#d8642a}.k-mies{--kc:#8a1f3a}.k-club{--kc:#3a66cf}.k-drink{--kc:#b8327f}.k-guest{--kc:#2b9a52}.k-def{--kc:#17829f}
.eArt{height:84px;display:flex;justify-content:center;align-items:flex-end;background:radial-gradient(circle at 50% 65%,#fff3d1,#f0dcb2);border-bottom:2px solid var(--ink);overflow:hidden}

.eArtE{font-size:50px;line-height:84px}
.k-mies .eArt{background:radial-gradient(circle at 50% 65%,#ffd3da,#e39aa8)}
.k-stoer .eArt{background:radial-gradient(circle at 50% 65%,#ffe6cf,#f2bf95)}
.eName{font-weight:700;font-size:15px;line-height:1.1;padding:5px 6px 0}
.eBadges{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;padding:4px 4px 0}

.eBadges .bm{background:#bdeccd}.eBadges .ba{background:#ffd9d5}.eBadges .b0{background:#e6e6e6}
.eText{font-size:12px;line-height:1.25;padding:4px 7px 8px;color:#4a3a40}
.ecard.lg{width:280px}
.ecard.lg .eBand{font-size:15px;padding:4px 12px}
.ecard.lg .eArt{height:190px}
.ecard.lg .eArtE{font-size:130px;line-height:190px}
.ecard.lg .eName{font-size:28px}
.ecard.lg .eBadges i{font-size:18px}
.ecard.lg .eText{font-size:17px;padding:6px 14px 14px}
.eiFace{display:inline-block;flex:none;width:var(--sz);height:var(--sz);border-radius:50%;overflow:hidden;background:#fff3d1;border:2px solid var(--ink);position:relative}
.eiFace svg{position:absolute;width:160%;height:auto;left:-30%;top:-62%}
/* Planung (Handy; .big = Fernseher) */
.eiPlan{display:flex;flex-direction:column;gap:10px;min-width:0}
.eTabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.eTab{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;background:#fff;border:3px solid var(--ink);border-radius:12px;font:700 11px var(--f);color:var(--ink);cursor:pointer;min-width:0;overflow:visible}
.eTab span{font-size:20px;line-height:1.1}
.eTab.on{background:var(--gold);box-shadow:0 3px 0 var(--ink)}

.eBody{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px;min-width:0}
.eHint{margin:0 0 8px;font-size:14px;line-height:1.35}
.eChip{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 6px;font-size:12px;font-weight:600;margin:2px 0}
.eMottos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eMot{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;background:#2a1b2d;color:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 0 0 2px var(--mc) inset;font-family:var(--f);cursor:pointer}
.eMot span{font-size:30px}

.eMot em{font-style:normal;font-weight:700;font-size:15px}
.eMot.on{box-shadow:0 0 0 4px var(--gold),0 0 0 2px var(--mc) inset,0 0 16px var(--mc);transform:scale(1.03)}
.eGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.eItem{display:flex;flex-direction:column;gap:6px;min-width:0}

.eItem.owned .ecard{opacity:.55}
.eBuy{font:700 15px var(--f);background:#fff;border:3px solid var(--ink);border-radius:99px;padding:6px;cursor:pointer;color:var(--ink)}
.eBuy.on{background:#3fd27a}

.eOwn{text-align:center;font-weight:700;color:var(--green);padding:6px}
.eStep{display:flex;align-items:center;justify-content:space-between;background:#fff;border:3px solid var(--ink);border-radius:99px;padding:2px}
.eStep button{width:38px;height:32px;border-radius:99px;border:0;background:var(--gold);font:700 20px var(--f);color:var(--ink);cursor:pointer}

.eFoot{position:sticky;bottom:6px;display:flex;flex-direction:column;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:8px 10px;box-shadow:0 -4px 14px rgba(0,0,0,.3);z-index:2}
.eSum{display:flex;justify-content:space-between;gap:6px;font-size:14px}
.eSum b{font-size:16px}.eSum b.neg{color:#b3261e}
.eReady{width:100%;font-size:20px}
.eReady.on{background:#3fd27a}
.eiPlan.big .eTab{font-size:16px;padding:6px}
.eiPlan.big .eTab span{font-size:30px}
.eiPlan.big .eBody{max-height:540px;overflow:auto}

.eiPlan.big .eMot span{font-size:52px}.eiPlan.big .eMot b{font-size:24px}.eiPlan.big .eMot em{font-size:22px}

.eiPlan.big .eSum{flex:1;font-size:20px;justify-content:flex-start;gap:30px}
.eiPlan.big .eSum b{font-size:24px}
.eiPlan.big .eReady{width:auto;font-size:26px}

.epCash{font-size:38px;font-weight:700}

.epActs{position:absolute;right:0;bottom:0}

/* Fernseher: Straße mit den Hütten */
.eiTop{position:absolute;left:200px;right:0;top:-10px;height:54px;display:flex;align-items:center;gap:16px;background:var(--paper);border:4px solid var(--ink);border-radius:18px;padding:2px 16px;font-size:20px;font-weight:600}

.eiStreet{position:absolute;left:200px;right:0;top:54px;bottom:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px}
.eiCol{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;border-radius:18px;padding:6px;transition:background .2s,box-shadow .2s}
.eiCol.aim{background:rgba(255,211,107,.3);box-shadow:0 0 0 5px var(--gold)}

.eiCol.shield{background:rgba(54,200,255,.25);box-shadow:0 0 0 5px #36c8ff}
@keyframes eiShake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.eiSign{height:56px;flex:none;border:3px solid var(--ink);border-radius:12px;background:#2a1b2d;color:var(--mc);text-align:center;display:flex;flex-direction:column;justify-content:center;box-shadow:0 0 0 2px var(--mc) inset;overflow:hidden}
.eiSign b{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;text-shadow:0 0 8px var(--mc)}
.eiSign small{font-size:14px;color:#fff;font-weight:700}
.eiSign.on{box-shadow:0 0 0 2px var(--mc) inset,0 0 20px var(--mc)}
.eiSign.off{opacity:.7}
.eiSign.off b{text-decoration:line-through;text-shadow:none}
.eiSign.off small{color:#ff9a9a}
.eiSign.hid{color:#fff;background:#4a3a50;box-shadow:none}
.eiSign.hid b{font-size:24px;text-shadow:none}
.eiSign.lit{animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
.eiHut{position:relative;height:196px;flex:none}
.eiHutSvg{position:absolute;left:0;bottom:0;width:100%;height:182px}
.eiCol.s-busted .eiHutSvg{filter:saturate(.55) brightness(.85)}
.eiBlue rect{animation:eiBlue .45s infinite alternate}

.eiLast{position:absolute;right:-4px;bottom:-4px;width:112px;z-index:3}

.eiStamp{position:absolute;left:44%;top:44%;transform:translate(-50%,-50%) rotate(-8deg);z-index:4;font-size:24px;font-weight:700;padding:3px 12px;border:4px solid var(--ink);border-radius:12px;background:var(--gold);white-space:nowrap;box-shadow:3px 4px 0 var(--ink);animation:eiStamp .4s cubic-bezier(.2,1.5,.4,1)}

.eiTeam{display:flex;align-items:center;flex:none;background:var(--t);border:3px solid var(--ink);border-left:10px solid var(--c);border-radius:12px;padding:2px 8px}

.eiLastP > small{font-weight:700;color:var(--muted)}
.eiLastP .ecard{width:150px}
.eiLastP .eiPops{position:static;flex-direction:row;flex-wrap:wrap;justify-content:center}
.eiQP .ph2{margin-bottom:0}
.eiQList{display:grid;gap:6px;margin-top:8px}
.eiQi{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:3px 10px 3px 3px}
.eiQi.bad{background:#ffe3df}
.eiQi.mies{background:#f3c9d2}
.eiQi b{display:block;font-size:15px;line-height:1.1}
.eiQi small{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.eiQi em{font-style:normal;font-weight:700;font-size:20px}
.eiRisk{margin:10px 0 6px;font-weight:700;text-align:center;padding:6px;border-radius:12px;background:#d5f5df}
.eiRisk.bad{background:#ff5d5d;color:#fff}
.eiBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.eiBtns .btn{font-size:21px;padding:.6em .3em}
.eiIn{background:#3fd27a}
.eiDone{margin:10px 0 0;text-align:center;font-weight:700}
.eiEnd.s-busted{background:#ffd9d5}
.eiEnd.s-closed,.eiEnd.s-full,.eiEnd.s-empty{background:#d5f5df}
/* Spielauswahl mit fünf Spielen */
.games{grid-template-columns:repeat(5,minmax(0,250px));gap:16px}
.games .gcard{min-height:280px;padding:16px 10px}
.games .gcard svg{width:180px;height:160px}
.games .gcard b{font-size:27px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

/* ---------- Verbindung (Supabase Realtime Broadcast, Test-Fallback: BroadcastChannel) ---------- */
const SB_READY = !/DEIN-/.test(SUPABASE_URL + SUPABASE_ANON_KEY);
function loadScript(src) { return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); }); }
async function connect(room, onMsg, onStatus) {
  if (SB_READY) {
    try {
      if (!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js');
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { realtime: { params: { eventsPerSecond: 30 } } });
      const ch = sb.channel('partybuddy-' + room, { config: { broadcast: { self: false, ack: false } } });
      ch.on('broadcast', { event: 'm' }, ({ payload }) => onMsg(payload));
      ch.subscribe(st => onStatus(st === 'SUBSCRIBED' ? 'online' : /ERROR|TIMED_OUT|CLOSED/.test(st) ? 'error' : 'connecting'));
      onStatus('connecting');
      return { send: m => { try { ch.send({ type: 'broadcast', event: 'm', payload: m }); } catch (e) {} } };
    } catch (e) { onStatus('error'); return { send: () => {} }; }
  }
  let bc = null;
  try { bc = new BroadcastChannel('partybuddy-' + room); bc.onmessage = e => onMsg(e.data); } catch (e) {}
  setTimeout(() => onStatus(bc ? 'local' : 'error'), 0);
  return { send: m => { try { bc && bc.postMessage(m); } catch (e) {} } };
}

const T = { room:'', screen:'lobby', teams: DEFAULT_TEAMS.map(t => t.slice()), wins:[0,0,0,0,0], phones:{}, seen:{}, epoch: Date.now() % 1000000, game:null, result:null, v:0 };
let net = null, netStatus = 'off', syncT = 0;
const STORE = 'pbhub.v1';
const alive = pid => !!pid && Date.now() - (T.seen[pid] || 0) < 15000;
const teamOf = ch => T.teams.findIndex(t => t.includes(ch));
const assigned = () => T.teams.flat().filter(Boolean);
// Handy -> Team (mehrere Handys pro Team erlaubt)
const phoneTeam = pid => { const t = T.phones[pid]; return Number.isInteger(t) && T.teams[t] && T.teams[t].some(Boolean) ? t : -1; };
const teamPhones = i => Object.keys(T.phones).filter(pid => T.phones[pid] === i && alive(pid)).length;
const joined = () => assigned().filter(ch => teamPhones(teamOf(ch)) > 0);
const realTeams = () => T.teams.map((t, i) => i).filter(i => T.teams[i].some(Boolean));
const tchars = i => T.teams[i].filter(Boolean);
function save() { try { localStorage.setItem(STORE, JSON.stringify({ teams:T.teams, wins:T.wins })); } catch (e) {} }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE));
    if (d && Array.isArray(d.teams) && d.teams.length === 5) T.teams = d.teams.map(t => [0, 1].map(k => CREW.includes(t[k]) ? t[k] : ''));
    if (d && Array.isArray(d.wins) && d.wins.length === 5) T.wins = d.wins.map(n => +n || 0);
  } catch (e) {}
}
function roomCode() {
  let r = null;
  try { r = localStorage.getItem('pbhub.room'); } catch (e) {}
  if (!r || !/^[A-Z]{4}$/.test(r)) {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    r = Array.from({ length: 4 }, () => A[Math.floor(Math.random() * A.length)]).join('');
    try { localStorage.setItem('pbhub.room', r); } catch (e) {}
  }
  return r;
}
const ctlURL = () => location.href.split('#')[0].split('?')[0] + '?r=' + T.room;
function sync() { if (!net || syncT) return; syncT = setTimeout(() => { syncT = 0; net.send(snapshot()); }, 40); }
function snapshot() {
  return { t:'state', v: ++T.v, screen: T.screen, teams: T.teams.map(t => t.filter(Boolean)), wins: T.wins, tlive: T.teams.map((_, i) => teamPhones(i)), epoch: T.epoch,
    g: T.game && T.screen === 'game' ? T.game.pub() : null, res: T.screen === 'result' ? T.result : null };
}
function onTvMsg(m) {
  if (!m || typeof m !== 'object' || typeof m.pid !== 'string' || m.pid.length > 40) return;
  const wasAlive = alive(m.pid);
  T.seen[m.pid] = Date.now();
  if ((m.t === 'join' || m.t === 'hello') && Number.isInteger(m.team) && m.epoch === T.epoch) {
    const t = m.team; if (t < 0 || t > 4 || !T.teams[t].some(Boolean)) { sync(); return; }
    const before = T.phones[m.pid];
    const hadPhone = teamPhones(t) > 0;
    T.phones[m.pid] = t;
    if (m.t === 'join' && before !== t) { Snd.pling(); if (T.screen === 'lobby' && !hadPhone) hugo(pick([`Team ${TEAMC[t].name} ist dabei!`, `Hallo ${duoName(tchars(t))}!`, `Team ${TEAMC[t].name} ist eingecheckt. Hohoho!`]), 2600); }
    refreshLive();
  } else if (m.t === 'leave') {
    delete T.phones[m.pid];
    refreshLive();
  } else if (m.t === 'act') {
    const t = phoneTeam(m.pid);
    if (t >= 0 && T.game && T.screen === 'game' && T.game.onAct) T.game.onAct(m.pid, t, m.a || {});
  }
  if (!wasAlive) refreshLive();
  sync();
}

/* ---------- Ton ---------- */
const Snd = (() => {
  let ac = null, muted = false;
  const ok = () => { if (muted) return false; try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return true; } catch (e) { return false; } };
  function tone(f, t0, d, type, vol, f2) { const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d); g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol || .1, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + d); o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + d + .05); }
  function noise(t0, d, vol, lp) { const len = Math.max(1, Math.floor(ac.sampleRate * d)), b = ac.createBuffer(1, len, ac.sampleRate), c = b.getChannelData(0); for (let i = 0; i < len; i++) c[i] = (Math.random() * 2 - 1) * (1 - i / len); const n = ac.createBufferSource(); n.buffer = b; const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp || 1500; const g = ac.createGain(); g.gain.value = vol || .3; n.connect(f).connect(g).connect(ac.destination); n.start(t0); }
  return {
    setMuted(v) { muted = v; }, get muted() { return muted; },
    pling() { if (!ok()) return; const t = ac.currentTime; tone(1046, t, .12, 'triangle', .08); tone(1568, t + .07, .2, 'triangle', .07); },
    tick() { if (!ok()) return; tone(1400, ac.currentTime, .04, 'square', .03); },
    snip() { if (!ok()) return; const t = ac.currentTime; noise(t, .08, .4, 6000); tone(2200, t, .06, 'square', .04); },
    fanfare() { if (!ok()) return; const t = ac.currentTime; [523, 659, 784, 1046].forEach((f, i) => tone(f, t + i * .12, .25, 'triangle', .12)); },
    pop() { if (!ok()) return; const t = ac.currentTime; noise(t, .35, .7, 4000); tone(160, t, .3, 'sine', .3, 50); },
    boom() { if (!ok()) return; const t = ac.currentTime; noise(t, 1.4, .8, 600); tone(90, t, .9, 'sine', .5, 30); },
    sad() { if (!ok()) return; const t = ac.currentTime; [392, 370, 349].forEach((f, i) => tone(f, t + i * .35, .33, 'sawtooth', .07)); },
    drum(sec) { if (!ok()) return; const t = ac.currentTime; for (let i = 0; i < sec * 14; i++) noise(t + i / 14, .06, .12 + .2 * i / (sec * 14), 900); },
    cheer() { if (!ok()) return; const t = ac.currentTime; noise(t, 1.2, .18, 3500); [784, 988, 1175].forEach((f, i) => tone(f, t + i * .08, .3, 'triangle', .06)); },
    whoosh() { if (!ok()) return; tone(300, ac.currentTime, .3, 'sine', .08, 1200); },
    shake() { if (!ok()) return; const t = ac.currentTime; for (let i = 0; i < 8; i++) noise(t + i * .11, .07, .22, 2600 + (i % 2) * 1800); },
  };
})();

let fxParts = [], fxRun = false;
function confetti(n, x0, x1) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#ffd36b', '#ff5d5d', '#3f8cff', '#2fc46a', '#a66bff', '#fff'];
  for (let i = 0; i < (n || 120); i++) fxParts.push({ x: rand(x0 || 200, x1 || 1400), y: rand(-40, 80), vx: rand(-3, 3), vy: rand(2, 7), r: rand(0, 6), vr: rand(-.2, .2), w: rand(10, 18), h: rand(6, 10), c: pick(cols), life: rand(2.5, 4) });
  if (!fxRun) { fxRun = true; requestAnimationFrame(fxLoop); }
}
let fxLast = 0;
function fxLoop(t) {
  const cv = $('#fx'), c = cv.getContext('2d'), dt = Math.min(.05, (t - (fxLast || t)) / 1000); fxLast = t;
  c.clearRect(0, 0, 1600, 900);
  fxParts = fxParts.filter(p => (p.life -= dt) > 0);
  for (const p of fxParts) { p.vy += 9 * dt; p.x += p.vx; p.y += p.vy; p.r += p.vr; c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.c; c.strokeStyle = '#2a1b2d'; c.lineWidth = 2; c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); c.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h); c.restore(); }
  if (fxParts.length) requestAnimationFrame(fxLoop); else { fxRun = false; fxLast = 0; c.clearRect(0, 0, 1600, 900); }
}

/* ---------- Spielablauf-Rahmen ---------- */
function startGame(def) {
  Snd.whoosh();
  if (T.game) T.game.stop();
  const g = def.make();
  g.def = def; T.game = g; T.screen = 'game'; $('#bAbort').hidden = false;
  g.alive = true;
  g.wait = ms => sleep(ms).then(() => { if (!g.alive) throw STOP; });
  g.roster = new Set(joined());
  g.run().catch(e => { if (e !== STOP) console.error(e); });
  sync();
}

}
// Teampunkte aus Einzelpunkten: Durchschnitt der mitspielenden Personen × 2 (fair, falls jemand fehlt)
function teamTotals(pts, roster) {
  return T.teams.map(tm => { const mem = tm.filter(ch => ch && roster.has(ch)); if (!mem.length) return 0; return Math.round(mem.reduce((s, ch) => s + (pts[ch] || 0), 0) / mem.length * 2); });
}
function finishGame(g, scores, opt) {
  opt = opt || {};
  g.alive = false;
  const teams = realTeams(), dir = opt.low ? -1 : 1, max = Math.max(...teams.map(i => dir * scores[i]));
  const top = teams.filter(i => dir * scores[i] === max), winner = pick(top);
  T.wins[winner]++; save();
  const ranking = teams.slice().sort((a, b) => dir * (scores[b] - scores[a]) || (a === winner ? -1 : b === winner ? 1 : 0));
  T.result = { game: g.def.title, scores, ranking, winner, tie: top.length > 1, chars: tchars(winner), disp: opt.disp || null, bar: opt.bar || null };
  T.screen = 'result'; T.game = null; $('#bAbort').hidden = true;
  renderResult(); sync();
}

/* =================================================================
   SPIEL: HUGOS PLÄTZCHEN-TABLETTS
   Vier Tabletts mit wenig bis viel Plätzchen. Jedes Team wählt eins.
   Allein auf einem Tablett: alle Plätzchen. Mehrere Teams: keiner bekommt etwas.
   ================================================================= */

// Vergleichsform: klein, Umlaute ausgeschrieben, ohne Satzzeichen, Artikel und Leerzeichen
function wlNorm(s) {
  return String(s || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim()
    .replace(/^(der|die|das|den|dem|ein|eine|einen|the|a|an) (?=\S)/, '').replace(/ /g, '');
}
// Einzahl/Mehrzahl: Kugel/Kugeln, Stern/Sterne, Geschenk/Geschenke …
function wlPlural(a, b) {
  const [s, l] = a.length <= b.length ? [a, b] : [b, a];
  return s.length >= 3 && l.startsWith(s) && ['e', 'n', 'en', 'er', 'r', 's', 'es', 'nen'].includes(l.slice(s.length));
}
function wlLev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    let p = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, p + (a[i - 1] === b[j - 1] ? 0 : 1)); p = t; }
  }
  return d[b.length];
}
// 'same' = gleich · 'near' = fast gleich (Tippfehler, Mehrzahl), Hugo fragt nach · 'diff' = verschieden
function wlSame(a, b) {
  const x = wlNorm(a), y = wlNorm(b);
  if (!x || !y) return 'diff';
  if (x === y) return 'same';
  if (wlPlural(x, y)) return 'near';
  const m = Math.min(x.length, y.length), d = wlLev(x, y);
  return (m >= 4 && d <= 1) || (m >= 7 && d <= 2) ? 'near' : 'diff';
}
// Prüft ein eingetipptes Wort: leer, zu lang oder schon benutzt (auch als Mehrzahl)?
function wlCheck(w, used) {
  const raw = String(w || '').trim(), n = wlNorm(raw);
  if (!n) return 'Bitte ein Wort eintippen.';
  if (raw.length > 30) return 'Höchstens 30 Zeichen.';
  const hit = (used || []).find(u => { const m = wlNorm(u); return m && (m === n || wlPlural(m, n)); });
  if (hit) return `„${hit}“ gab es schon. Denkt euch ein neues Wort aus.`;
  return '';
}
/* =================================================================

   Ein Team nach dem anderen. Startwort, dann tippen beide geheim ein Wort.
   Ungleich: Nächste Runde mit einem Wort, das die beiden letzten verbindet.
   Höchstens 15 Runden. Wenigste Runden gewinnt.
   ================================================================= */
function Gedanke() {
  const g = { id:'wl', phase:'intro', order:[], ti:-1, team:-1, r:0, start:'', chain:[], words:[null, null], claims:[null, null], shown:false, match:null,
    res:[null, null, null, null, null], tvIn:-1 };
  const claimOk = pid => !!pid && alive(pid) && T.phones[pid] === g.team;
  const used = () => [g.start, ...g.chain.flat()];
  const nm = () => tchars(g.team);
  const prev = () => g.chain[g.chain.length - 1];
  let doneRes = null, liveT = 0;
  g.pub = () => ({ id:'wl', phase:g.phase, ti:g.ti, order:g.order, team:g.team, round:g.r, max:WL_MAX, start: g.phase === 'turn' ? null : g.start,
    chain:g.chain, sub:[!!g.words[0], !!g.words[1]], claims:g.claims.map(p => claimOk(p) ? p : null), words: g.shown ? g.words : null,
    match:g.match, res:g.res, tvIn:g.tvIn, win: g.phase === 'finale' ? g.win : null });
  g.stop = () => { g.alive = false; clearInterval(liveT); };
  const waitFor = (sel, ms) => new Promise(res => { const b = document.querySelector(sel); if (b) b.addEventListener('click', res, { once:true }); if (ms) setTimeout(res, ms); }).then(() => { if (!g.alive) throw STOP; Snd.pling(); });
  const choose = (ids, ms, dflt) => new Promise(res => { ids.forEach(id => { const b = document.getElementById(id); if (b) b.addEventListener('click', () => res(id), { once:true }); }); if (ms) setTimeout(() => res(dflt), ms); }).then(id => { if (!g.alive) throw STOP; Snd.pling(); return id; });

  g.run = async () => {
    await introCard(g, [
      'Ein Team nach dem anderen ist dran. Ihr bekommt ein <b>Startwort</b>.',
      'Beide tippen <b>geheim</b> ein Wort, an das sie dabei denken: am besten jeder an seinem Handy, sonst nacheinander an einem Handy oder am Fernseher.',
      'Auf drei werden beide Wörter gezeigt. Gleich? Geschafft! Sonst sucht ihr ein Wort, das <b>eure beiden Wörter verbindet</b>. Schon benutzte Wörter sind tabu.',
      `Höchstens ${WL_MAX} Runden. Das Team mit den <b>wenigsten Runden</b> gewinnt und entscheidet über die Buddy-Box.`],
      'Mal sehen, wer hier wirklich auf einer Wellenlänge ist!');
    g.order = shuffle(realTeams().filter(t => tchars(t).length === 2));
    const starts = shuffle(WL_START);
    for (g.ti = 0; g.ti < g.order.length; g.ti++) await turn(g.order[g.ti], starts[g.ti]);
    const sc = [0, 1, 2, 3, 4].map(t => g.res[t] ? g.res[t].r : 99);
    const disp = sc.map((v, t) => !g.res[t] ? '–' : g.res[t].ok ? `Runde ${v}` : '✗'), bar = sc.map(v => v > WL_MAX ? 3 : Math.round((WL_MAX + 1 - v) / WL_MAX * 100));
    const w = await finale();
    if (w != null) sc[w] -= .5;
    finishGame(g, sc, { low:true, disp, bar });
  };

  // ---------- Ein Team ----------
  async function turn(t, start) {
    Object.assign(g, { team:t, start, r:0, chain:[], words:[null, null], claims:[null, null], shown:false, match:null, tvIn:-1, phase:'turn' });
    renderTurn(); sync();
    hugo(`Team ${TEAMC[t].name}, ihr seid dran! ${duoName(nm())}, seid ihr auf einer Wellenlänge?`, 5000);
    await waitFor('#wlGo'); Snd.whoosh();
    build();
    let ok = false;
    for (let r = 1; r <= WL_MAX; r++) { g.r = r; if (await round()) { ok = true; break; } }
    g.res[t] = { r: ok ? g.r : WL_MAX + 1, ok, start, word: ok ? prev()[0] : null, chain: g.chain.map(p => p.slice()) };
    await turnEnd(t);
  }
  function renderTurn() {
    const t = g.team, tc = TEAMC[t], n = teamPhones(t);
    $('#screen').innerHTML = `<section class="wl"><div class="card turnCard" style="--c:${tc.c};--t:${tc.t}"><div class="duo">${nm().map(ch => `<img src="${ART.full[ch]}" alt="${esc(ch)}">`).join('')}</div>
      <h2>Team ${tc.name} ist dran!</h2><p class="big2">${esc(duoName(nm()))}: Seid ihr auf einer Wellenlänge?</p>
      <p>${n >= 2 ? 'Jeder tippt geheim an seinem eigenen Handy.' : n === 1 ? 'Ihr habt ein Handy: Tippt nacheinander, der andere schaut weg.' : 'Ihr tippt nacheinander am Fernseher, der andere schaut weg.'}</p>
      ${othersHTML()}
      <button class="btn" id="wlGo">Startwort aufdecken</button></div></section>`;
  }
  function othersHTML() {
    return `<div class="wlOthers">${g.order.map(t => { const R = g.res[t]; return `<span class="wlO${t === g.team ? ' cur' : ''}" style="--c:${TEAMC[t].c};--t:${TEAMC[t].t}">${tchars(t).map(ch => bust(ch, TEAMC[t])).join('')}<span>${R ? (R.ok ? 'Runde ' + R.r : '✗') : t === g.team ? 'spielt' : '–'}</span></span>`; }).join('')}</div>`;
  }

  // ---------- Bühne ----------
  function build() {
    const t = g.team, tc = TEAMC[t];
    $('#screen').innerHTML = `<section class="wl" id="wl">
      <div class="wlTop" style="--c:${tc.c};--t:${tc.t}"><span class="wlTeam">${nm().map(ch => bust(ch, tc)).join('')}<b>Team ${tc.name}</b></span><span class="wlRound" id="wlRound"></span>${othersHTML()}</div>
      <div class="wlPrompt" id="wlPrompt"></div>
      <div class="wlStage">${[0, 1].map(s => `<div class="wlP" id="wlP${s}"><div class="thought" id="wlB${s}"></div><img src="${ART.full[nm()[s]]}" alt="${esc(nm()[s])}"><div class="wlPlate"><b>${esc(nm()[s])}</b><span id="wlD${s}"></span></div></div>`).join('<div class="wlMid" id="wlMid"></div>')}</div>
      <aside class="card wlChain" id="wlChain"></aside>
      <div class="wlTvIn" id="wlTvIn" hidden></div></section>`;
    $('#wl').addEventListener('click', e => { const b = e.target.closest('[data-tvin]'); if (b && g.phase === 'input') { Snd.tick(); openTvIn(+b.dataset.tvin, false); } });
  }
  function drawTop() {
    const el = $('#wlRound'); if (!el) return;
    const done = g.chain.length;
    el.innerHTML = `<b>Runde ${g.r}</b> von ${WL_MAX}<span class="wlDots">${Array.from({ length: WL_MAX }, (_, i) => `<i class="${i < done ? (g.match && i === done - 1 ? 'm' : 'p') : i === g.r - 1 ? 'c' : ''}"></i>`).join('')}</span>`;
  }
  function drawPrompt() {
    const el = $('#wlPrompt'); if (!el) return;
    const p = g.r > 1 ? g.chain[g.r - 2] : null;
    el.innerHTML = !p ? `<small>Euer Startwort</small><b class="wlWord start">${esc(g.start)}</b><span>Woran denkt ihr dabei?</span>`
      : `<small>Runde ${g.r}: Welches Wort verbindet …</small><div class="row"><b class="wlWord">${esc(p[0])}</b><i>+</i><b class="wlWord">${esc(p[1])}</b></div>`;
  }
  function drawBubbles() {
    [0, 1].forEach(s => {
      const b = $('#wlB' + s), d = $('#wlD' + s); if (!b) return;
      if (g.shown) {
        const w = g.words[s] || '';
        b.className = 'thought show' + (g.match === true ? ' ok' : g.match === false ? ' no' : '');
        b.innerHTML = `<span class="w" style="font-size:${w.length > 18 ? 24 : w.length > 11 ? 30 : 38}px">${esc(w)}</span>`;
      } else if (g.words[s]) { b.className = 'thought done'; b.innerHTML = `<span class="st">✓ hat getippt</span>`; }
      else { b.className = 'thought'; b.innerHTML = `<span class="st">denkt nach <span class="dots3"><i>.</i><i>.</i><i>.</i></span></span>${g.phase === 'input' && g.tvIn !== s && !claimOk(g.claims[s]) ? `<button class="wlTvBtn" data-tvin="${s}">am Fernseher tippen</button>` : ''}`; }
      const n = teamPhones(g.team);
      if (d) d.textContent = g.tvIn === s ? '📺 tippt am Fernseher' : claimOk(g.claims[s]) ? '📱 eigenes Handy' : n === 1 ? '📱 teilt sich ein Handy' : n === 0 ? '📺 Fernseher' : '📱 wählt am Handy …';
    });
  }
  function drawChain() {
    const el = $('#wlChain'); if (!el) return;
    const rows = g.chain.map((p, i) => `<div class="wlC${g.match && i === g.chain.length - 1 ? ' m' : ''}"><span class="n">${i + 1}</span><span>${esc(p[0])}</span><span>${esc(p[1])}</span></div>`);
    if (g.chain.length < g.r) rows.push(`<div class="wlC c"><span class="n">${g.r}</span><span>?</span><span>?</span></div>`);
    el.innerHTML = `<h3>Gedankenkette</h3><div class="wlC s"><span>Start</span><b>${esc(g.start)}</b></div>${rows.join('')}`;
  }
  function drawMid(kind) {
    const el = $('#wlMid'); if (!el) return;
    const last = g.r >= WL_MAX;
    el.innerHTML = kind === 'judge' ? `<span class="wlSign">≈</span><p>Fast gleich! Zählt das?</p><button class="btn" id="wlYes">Ja, gleich!</button><button class="btn sec" id="wlNo">Nein</button>`
      : kind === 'miss' ? `<span class="wlSign no">≠</span><p>${last ? 'Leider nicht gleich.' : 'Nicht gleich!'}</p><button class="btn" id="wlNext">${last ? 'Weiter' : 'Nächste Runde'}</button><button class="btn sec sm2" id="wlSame">Doch gleich!</button>`
      : kind === 'match' ? `<span class="wlSign ok">=</span><p>Gleicher Gedanke!</p>`
      : kind === 'count' ? `<span class="wlSign">?</span>` : `<span class="wlSign q">?</span><p>${g.words[0] && g.words[1] ? 'Beide haben getippt!' : 'Geheim tippen …'}</p>`;
  }
  function drawAll(mid) { drawTop(); drawPrompt(); drawBubbles(); drawChain(); drawMid(mid || 'input'); }

  // ---------- Eine Runde ----------
  async function round() {
    Object.assign(g, { phase:'input', words:[null, null], shown:false, match:null, tvIn:-1 });
    drawAll(); sync();
    const p = prev();
    hugo(g.r === 1 ? `Euer Startwort: „${g.start}“. Woran denkt ihr?` : `Welches Wort verbindet „${p[0]}“ und „${p[1]}“?`, 4500);
    const both = new Promise(res => { doneRes = res; });
    clearInterval(liveT); liveT = setInterval(() => { if (g.alive && g.phase === 'input') drawBubbles(); }, 1000);
    if (teamPhones(g.team) === 0) tvSeq();
    await both;
    clearInterval(liveT); closeTvIn();
    if (!g.alive) throw STOP;
    // Auf drei aufdecken
    g.phase = 'reveal'; drawBubbles(); drawMid('count'); sync();
    for (const n of ['3', '2', '1']) { big(n); Snd.tick(); await g.wait(650); }
    hideBig();
    g.shown = true; drawBubbles(); Snd.pop(); sync();
    await g.wait(900);
    const s = wlSame(g.words[0], g.words[1]);
    let ok = s === 'same';
    if (s === 'near') {
      g.phase = 'judge'; drawMid('judge'); sync();
      hugo(`„${g.words[0]}“ und „${g.words[1]}“: Zählt das als gleich?`, 6000);
      ok = (await choose(['wlYes', 'wlNo'])) === 'wlYes';
    }
    g.chain.push(g.words.slice());
    if (!ok) {
      g.match = false; g.phase = 'miss'; drawBubbles(); drawChain(); drawTop(); drawMid('miss'); Snd.sad(); sync();
      hugo(g.r >= WL_MAX ? `${WL_MAX} Runden und kein gleicher Gedanke. Schade!` : pick(['Knapp daneben! Findet ein Wort, das beide verbindet.', 'Noch nicht synchron. Nächster Versuch!', 'Hmm. Was haben die beiden Wörter gemeinsam?', 'Nicht gleich, aber ihr kommt euch näher!']), 4000);
      if ((await choose(['wlNext', 'wlSame'], 9000, 'wlNext')) === 'wlSame') ok = true;
    }
    if (ok) {
      g.match = true; g.phase = 'match'; drawBubbles(); drawChain(); drawTop(); drawMid('match'); sync();
      [0, 1].forEach(k => { const el = $('#wlP' + k); if (el) el.classList.add('jump'); });
      Snd.fanfare(); confetti(140, 300, 1200); big('Gleicher Gedanke!', `in Runde ${g.r}`, 2600);
      hugo(pick(['Zwei Köpfe, ein Gedanke!', 'Seelenverwandt! Hohoho!', 'Das nenne ich Party Buddys!', 'Perfekt synchron!']), 4000);
      await g.wait(3400);
    }
    return ok;
  }
  function setWord(s, w) {
    if (g.phase !== 'input' || g.words[s]) return false;
    g.words[s] = w; Snd.pling();
    if (g.tvIn === s) closeTvIn();
    drawBubbles(); drawMid('input'); sync();
    if (g.words[0] && g.words[1] && doneRes) { const r = doneRes; doneRes = null; setTimeout(r, 600); }
    return true;
  }
  g.onAct = (pid, team, a) => {
    if (team !== g.team || g.phase !== 'input' || a.ti !== g.ti || a.r !== g.r) return;
    const s = a.slot; if (s !== 0 && s !== 1) return;
    if (claimOk(g.claims[s]) && g.claims[s] !== pid) return;
    if (a.wl === 'claim') {
      if (g.claims[1 - s] === pid) g.claims[1 - s] = null;
      g.claims[s] = pid; drawBubbles(); sync(); return;
    }
    if (a.wl === 'word') {
      const w = String(a.w || '').trim().slice(0, 30);
      if (wlCheck(w, used())) { sync(); return; }
      setWord(s, w);
    }
  };

  // ---------- Eingabe am Fernseher ----------
  function tvSeq() { const s = !g.words[0] ? 0 : !g.words[1] ? 1 : -1; if (s >= 0) openTvIn(s, s === 1); }
  function openTvIn(s, handover) {
    const el = $('#wlTvIn'); if (!el || g.words[s]) return;
    const me = nm()[s], other = nm()[1 - s], tc = TEAMC[g.team];
    g.tvIn = s; drawBubbles(); sync();
    const head = (title, sub) => `<div class="wlTvWho">${bust(me, tc)}<div><b>${title}</b><span>${sub}</span></div></div>`;
    const form = () => {
      el.innerHTML = `<div class="card wlTvCard">${head(`${esc(me)} tippt am Fernseher`, `${esc(other)}: wegschauen! 🙈`)}
        <input id="wlTvInp" maxlength="30" autocomplete="off" spellcheck="false" aria-label="Wort von ${esc(me)}"><p class="wlErr" id="wlTvErr" role="alert"></p>
        <div class="wlTvBtns"><button class="btn sec" id="wlTvX">Abbrechen</button><button class="btn" id="wlTvOk">Abschicken</button></div></div>`;
      el.hidden = false;
      const inp = $('#wlTvInp'); inp.focus();
      const ok = () => {
        const w = inp.value.trim(), e = wlCheck(w, used());
        if (e) { $('#wlTvErr').textContent = e; Snd.sad(); return; }
        closeTvIn();
        if (setWord(s, w.slice(0, 30)) && teamPhones(g.team) === 0) tvSeq();
      };
      $('#wlTvOk').addEventListener('click', ok);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ok(); } });
      inp.addEventListener('input', () => { $('#wlTvErr').textContent = ''; });
      $('#wlTvX').addEventListener('click', () => closeTvIn());
    };
    if (handover) {
      el.innerHTML = `<div class="card wlTvCard">${head(`Jetzt ${esc(me)}!`, `${esc(other)}: schau weg! 🙈`)}<div class="wlTvBtns"><button class="btn" id="wlTvReady">${esc(me)} ist bereit</button></div></div>`;
      el.hidden = false; $('#wlTvReady').addEventListener('click', () => { Snd.tick(); form(); });
      setTimeout(() => { const r = $('#wlTvReady'); if (r) r.focus(); }, 700);
    } else form();
  }
  function closeTvIn() {
    const el = $('#wlTvIn'); if (el) { el.hidden = true; el.innerHTML = ''; }
    if (g.tvIn !== -1) { g.tvIn = -1; drawBubbles(); sync(); }
  }

  // ---------- Team fertig ----------
  async function turnEnd(t) {
    g.phase = 'turnEnd'; sync();
    const R = g.res[t], tc = TEAMC[t], last = g.ti === g.order.length - 1;
    const path = [`<span class="s">${esc(R.start)}</span>`, ...R.chain.map((p, i) => `<span class="${R.ok && i === R.chain.length - 1 ? 'm' : ''}"><i>${i + 1}</i> ${esc(p[0])} · ${esc(p[1])}</span>`)].join('<em>→</em>');
    $('#screen').innerHTML = `<section class="wl"><div class="card turnCard wlEnd" style="--c:${tc.c};--t:${tc.t}"><div class="duo">${nm().map(ch => `<img src="${ART.full[ch]}" alt="${esc(ch)}">`).join('')}</div>
      <h2>${R.ok ? `Gleicher Gedanke in Runde ${R.r}!` : 'Kein gleicher Gedanke'}</h2>
      <p class="big2">${R.ok ? `Beide dachten an „${esc(R.word)}“` : `Nach ${WL_MAX} Runden noch nicht synchron.`}</p>
      <div class="wlPath">${path}</div>
      <button class="btn" id="wlNextT">${last ? 'Zur Auswertung' : 'Nächstes Team'}</button></div></section>`;
    if (R.ok) { Snd.cheer(); hugo(R.r === 1 ? 'Gleich in der ersten Runde! Das ist Gedankenlesen!' : R.r <= 4 ? 'Stark! Ihr seid echte Party Buddys.' : 'Geschafft! Mal sehen, ob das reicht.', 5000); }
    else { Snd.sad(); hugo('Ihr habt alles gegeben. Vielleicht klappt es beim nächsten Spiel!', 5000); }
    await waitFor('#wlNextT');
  }

  // ---------- Auswertung ----------
  async function finale() {
    g.phase = 'finale'; g.team = -1;
    const best = Math.min(...g.order.map(t => g.res[t].r)), tied = g.order.filter(t => g.res[t].r === best), w = tied.length ? pick(tied) : null;
    const rk = g.order.slice().sort((a, b) => g.res[a].r - g.res[b].r || (a === w ? -1 : b === w ? 1 : 0) || a - b);
    g.win = w; sync();
    $('#screen').innerHTML = `<section class="wl"><div class="card wlFin"><h2>Wer denkt am gleichsten?</h2>
      ${rk.map((t, i) => { const R = g.res[t], tc = TEAMC[t]; return `<div class="wlFr" style="--c:${tc.c};--t:${tc.t}"><span class="n">${i + 1}</span><span class="duo2">${tchars(t).map(ch => bust(ch, tc)).join('')}</span><span class="wfw"><b>${R.ok ? `„${esc(R.word)}“` : '✗ nicht geschafft'}</b><small>Start: ${esc(R.start)}${R.chain.length > 1 ? ` · ${R.chain.length} Runden Gedankenkette` : ''}</small></span><b class="wfr">${R.ok ? `Runde ${R.r}` : '–'}</b></div>`; }).join('')}
      ${tied.length > 1 ? `<p class="wlTie">🪙 Gleichstand! Hugo hat eine Münze geworfen: Team ${TEAMC[w].name} gewinnt.</p>` : ''}
      <div class="wlFinActs"><button class="btn" id="wlFin">Weiter zur Siegerehrung</button></div></div></section>`;
    Snd.fanfare();
    if (w != null) hugo(tied.length > 1 ? `Gleichstand! ${tied.length} Teams mit ${best > WL_MAX ? 'keinem Treffer' : `Runde ${best}`}. Ich werfe eine Münze … Team ${TEAMC[w].name} gewinnt!` : `Team ${TEAMC[w].name} war am schnellsten auf einer Wellenlänge!`, 7000);
    await waitFor('#wlFin');
    return w;
  }
  return g;
}

const eiTrouble = (id, own) => (EI_CARDS[id].a || 0) + (id === 'suff' && own.jaeger ? 1 : 0);
function eiPlanCheck(plan, money, own, deck) {
  const cart = {}, out = { motto: plan && EI_MOTTO_BY[plan.motto] ? plan.motto : null, cart, ready: !!(plan && plan.ready), cost:0, err:'' };
  const src = plan && plan.cart && typeof plan.cart === 'object' ? plan.cart : {};
  let mies = 0;
  const noisy = deck.filter(id => eiTrouble(id, own) > 0).length;
  for (const it of EI_SHOP) {
    let q = Math.max(0, Math.floor(+src[it.id] || 0));
    if (!q) continue;
    if (it.cat === 'club' || it.cat === 'drink') q = own[it.id] ? 0 : 1;
    else if (it.cat === 'guest') q = Math.min(q, it.multi || 1, it.id === 'hausverbot' ? noisy : 9);
    else if (it.def) q = 1;
    else q = Math.min(q, EI_MIES_MAX - mies);
    if (it.cat === 'mies' && !it.def) mies += q;
    if (q > 0) { cart[it.id] = q; out.cost += q * it.p; }
  }
  if (out.cost > money) out.err = 'Nicht genug Geld in der Kasse.';

}

function eiMoney(id, own, ns) {

  if (id === 'party') m += (own.dj ? 5 : 0) + (own.jaeger ? 8 : 0);
  if (id === 'promi' && own.champ) m += 50;
  if (own.gluehwein) m += 2;

  if (ns.uniq && !ns.strom) m += ns.bonus * (own.kugel ? 2 : 1);

  // ---------- Auflösung: Mottos und Gemeinheiten ----------
  async function revealPhase() {
    g.phase = 'reveal';
    const cnt = {}; g.teams.forEach(t => { cnt[S_(t).motto] = (cnt[S_(t).motto] || 0) + 1; });
    const pre = {}; g.teams.forEach(t => { pre[t] = { recv:[], ratten:0, tipp:0, strom:false, sec:S_(t).security }; });
    const sends = [];
    for (let k = 0; k < EI_MIES_MAX; k++) shuffle(g.teams).forEach(t => { if (S_(t).send[k]) sends.push({ from:t, id:S_(t).send[k] }); });
    g.evs = [];
    sends.forEach(sd => {
      const others = g.teams.filter(x => x !== sd.from); if (!others.length) return;
      const to = pick(others), P = pre[to]; let blocked = false;
      if (P.sec) { P.sec = false; blocked = true; }
      else if (sd.id === 'm_krampus') P.recv.push({ id:'krampus', from:sd.from });
      else if (sd.id === 'm_rudi') P.recv.push({ id:'rudi', from:sd.from });
      else if (sd.id === 'm_ratten') P.ratten++;
      else if (sd.id === 'm_tipp') P.tipp++;
      else if (sd.id === 'm_strom') P.strom = true;
      g.evs.push({ from:sd.from, id:sd.id, to, blocked, others });
    });
    g.teams.forEach(t => {
      const s = S_(t);
      eiPrepNight(s, { recv:pre[t].recv, ratten:pre[t].ratten, tipp:pre[t].tipp, strom:pre[t].strom, motto:s.motto, uniq:cnt[s.motto] === 1, bonus:g.bonus[s.motto] });

    g.evShown = 0; g.reveal = { signs:false, queues:false };
    buildStreet(); sync();
    hugo('Und heute Abend feiern die Hütten …', 3000);
    await g.wait(1400);
    // Mottos nacheinander aufleuchten lassen
    for (const t of g.teams) { g.reveal.signT = t; const el = $('#eiS' + t); if (el) { el.outerHTML = signHTML(t); } Snd.tick(); await g.wait(450); }
    g.reveal.signs = true; drawStreet(); sync();
    const dup = EI_MOTTOS.filter(m => cnt[m.id] > 1);
    if (dup.length) { Snd.sad(); hugo(`${dup.map(m => m.n).join(' und ')} ${dup.length > 1 ? 'gibt es' : 'gibt es'} mehrfach: dort kein Bonus!`, 4500); }
    else { Snd.cheer(); hugo('Jedes Motto nur einmal! Alle bekommen ihren Bonus.', 4000); }

    $('#eiBig').innerHTML = '';
    g.reveal.queues = true; drawStreet(); sync();

  // ---------- Der Abend ----------
